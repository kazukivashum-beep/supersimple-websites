<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vashum web</title>
    <style>
        body {
            padding-left: 15%;
            box-sizing: border-box;
            background-image: url(https://i.pinimg.com/736x/37/3b/96/373b96a6ca53a65ece52e7b677263ec5.jpg);
        }

        h1 {
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 30%;
            font-size: 20px;
        }


        p {
            color: rgb(99, 230, 99);
            font-size: 30px;
            padding-right: 20%;
        }


        h2 {
            color: rgb(20, 123, 250);
            padding-right: 50px;
        }

        input {
            border-radius: 3px;
            padding-left: 20px;
            padding: 3px;
            border-color: rgb(0, 0, 0);
        }



        button {
            border-radius: 3px;
            border: none;
            cursor: pointer;
            background-color: blueviolet;
        }

        button:hover {
            background-color: aliceblue;
        }

        h3 {
            color: whitesmoke;
        }
        form {
            color: rgb(21, 244, 222);
        }
    </style>
</head>
<body>
    <h1>Hello welcome to my webside</h1>
    <p>
        Creating my owned Login
         form is a
        beagining.
    </p>

    <h2>Login</h2>
    <input class="text" placeholder="Username"><div>
    <input class="text" placeholder="Password"><div>
    <button class="submit">Login</button><div>
    </div>

    <h3>Gender</h3>
    <form>
    Male:<input type="checkbox" value="Male">
    Female:<input type="checkbox" value="Female">
    </form>
</body>
</html>
